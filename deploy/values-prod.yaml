# svc-hook-echo — prod overlay (layered on values.yaml for the env: prod cluster).
# The image tag is NOT here: it is the lane record, argo-apps
# lanes/prod/svc-hook-echo.yaml, written by .github/workflows/deploy.yml.

# ❗Open mode (ravn-platform#821): the one Ravn-run echo, for every org's
# *Use Ravn echo* hook. It holds no credential of anyone's: no signing secret,
# no service account, no VIEW_TOKEN. It answers with the Ravn-Answer-Token each
# delivery carries, and keeps a delivery (in memory) only once Ravn accepts
# that answer. The app refuses to start in open mode if any of those
# credentials is set, so the old secretRef (ravn/prod/svc-hook-echo/hook) is
# gone from here. Retire that secret's container in ravn-ops separately.
#
# Deploy this only once Ravn sends Ravn-Answer-Token (ravn-platform#821, task
# A): before then every delivery here is refused with 401.

# Helm replaces lists: this is the whole env.
env:
  - {name: ECHO_MODE, value: "open"}
  - {name: PUBLIC_BASE_URL, value: "https://echo-hook.ravnsecurity.io"}
  - {name: RAVN_URL, value: "https://apps.ravnsecurity.io"}
  - {name: ANSWER_STAGES, value: "classify,route,assess,review,follow-up,knowledge"}
  # Per minute. Every org's deliveries come from Ravn's own egress, so the
  # per-address limit is a ceiling for all of them together; per hook is the
  # one that keeps orgs apart.
  - {name: RATE_PER_HOOK, value: "60"}
  - {name: RATE_PER_IP, value: "600"}
  - {name: RATE_VIEW_PER_IP, value: "120"}
  # ingress-nginx appends its peer to X-Forwarded-For (use-forwarded-headers,
  # compute-full-forwarded-for in ravn-ops infra/platform/ingress-nginx). Its
  # peer is the NLB, which does not pass the client's address on today, so
  # per-address limits key on the NLB node until it does.
  - {name: TRUSTED_PROXY_HOPS, value: "1"}
