# svc-hook-echo — base values (env-agnostic). Overrides the shared chart
# (ravn-ops/infra/charts/service). Not a subgraph: a public hook endpoint and
# its viewer, on its own host (set per lane by argo-apps apps/svc-hook-echo.yaml).

# ECR repo (created by ravn-ops' services unit from infra/services/svc-hook-echo).
# The tag comes from the lane record, argo-apps lanes/<env>/svc-hook-echo.yaml.
image:
  repository: "244689414108.dkr.ecr.us-west-2.amazonaws.com/ravn/svc-hook-echo"
  tag: ""

# ❗One replica, always. Open mode keeps its deliveries in memory, in this one
# process: the viewer and Clear only see the store of the pod they reach, so a
# second pod would hide about half the deliveries from each.
replicaCount: 1

# The image listens on 8080 (Dockerfile: PORT=8080). Chart Service 80 -> 8080.
service:
  targetPort: 8080

# The root of its own origin, not a path on the apps host: it serves a viewer
# page, which must not share cookies or storage with the portal. Nothing to
# strip, so no rewrite.
ingress:
  enabled: true
  pathPrefix: ""
  stripPrefix: false

# Always 200 while the process serves, configured or not: a pod waiting for its
# secret must stay up, not crash-loop. `configured` in the body says which.
healthCheck:
  path: /healthz

# A ServiceMonitor for /metrics: deliveries by stage and outcome, answers by
# Ravn's code. The hook refuses /metrics to anything with x-forwarded-for, so
# the ingress doesn't serve it publicly; Prometheus scrapes the pod directly.
metrics:
  enabled: true
  path: /metrics

# No volume. Open mode holds no credential and writes no state file, so the
# chart leaves persistence off and rolls a deploy instead of using Recreate.
# Turning it off prunes the old svc-hook-echo-data PVC (ravn-hook-echo#35).
persistence:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
