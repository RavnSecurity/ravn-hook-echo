name: release

# A tag v<version> publishes the container image to GHCR, the package to GitHub
# Packages' npm registry as @ravnsecurity/ravn-hook-echo, and, when an NPM_TOKEN
# secret is set, the package to npmjs so `npx ravn-hook-echo` works.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

      - name: the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: container image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

      # npm refuses --provenance from a private source repository, so it's passed
      # only once the repo is public.
      - name: provenance when public
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = false ]; then
            echo "PROVENANCE=--provenance" >> "$GITHUB_ENV"
          else
            echo "::notice::private repository: publishing without provenance"
          fi

      - name: npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::npmjs skipped: no NPM_TOKEN secret"
            exit 0
          fi
          # shellcheck disable=SC2086 # empty when private
          npm publish $PROVENANCE --access public

      # GitHub's npm registry takes only names scoped to the owner, so this
      # publishes a packed copy renamed @ravnsecurity/ravn-hook-echo. package.json
      # keeps the unscoped name npmjs and the docs use. The copy is already
      # built, so its scripts go: npm runs `prepare` even with --ignore-scripts,
      # and the copy has no sources to build. No provenance: npm attests to
      # npmjs only.
      - name: GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage="$RUNNER_TEMP/github-package"
          mkdir -p "$stage"
          npm pack --pack-destination "$stage"
          tar -xzf "$stage"/*.tgz -C "$stage"
          cd "$stage/package"
          npm pkg set name=@ravnsecurity/ravn-hook-echo
          npm pkg delete scripts
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --ignore-scripts --registry https://npm.pkg.github.com
